[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gazefov"
version = "0.1.0"
description = "IR eye tracking for headsets: synthetic IR eye renderer, pupil/glint pipeline, per-user calibration, PCCR and 3D model-based gaze, and a gaze protocol for foveated rendering."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "the gazefov authors" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.optional-dependencies]
camera = ["opencv-python-headless>=4.8"]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/coopersimpson101-debug/gazefov"
Issues = "https://github.com/coopersimpson101-debug/gazefov/issues"
Changelog = "https://github.com/coopersimpson101-debug/gazefov/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["gazefov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
