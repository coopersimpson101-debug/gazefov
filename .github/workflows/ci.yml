name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q
      - name: Quick gaze benchmark (2 subjects, smoke test)
        run: python scripts/eval_gaze.py --subjects 2 --test 4 --supersample 1 --workers 2 --quick
      - run: python -m gazefov.safety

  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: render/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # GPU tests skip themselves (reported as skipped) when Dawn finds no adapter on the runner.
      - run: npm test
      - run: npm run build
